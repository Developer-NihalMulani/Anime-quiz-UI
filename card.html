<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aniquiz</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-5">
        <div class="row mb-5 justify-content-center d-flex">
            <div class="border border-2 border-black bg-l rounded-4 p-4 mt-5 col-8">
                <h1 class="text-center fw-bolder mb-3">
                    Your Anime Quiz
                </h1>
                <p class="col-10 fs-5 fw-medium mb-3">
                    Test your knowledge of anime's fastest fighters and electric attacks. Answer quickly to build a
                    streak and earn bonus points.
                </p>
                <div class="d-flex justify-content-between mt-4 mb-4">
                    <span class="w-30 px-3 py-2 border border-2 border-black bg-d rounded-2">
                        <h1 class="fw-bold m-0">
                            10
                        </h1>
                        <h4>
                            Questions
                        </h4>
                    </span>
                    <span class="w-30 px-3 border border-2 border-black bg-d rounded-2">
                        <h1 class="fw-bold m-0">
                            30 sec
                        </h1>
                        <h4>
                            per question
                        </h4>
                    </span>
                    <span class="w-30 px-3 border border-2 border-black bg-d rounded-2">
                        <h2 class="fw-bold m-0">
                            medium
                        </h2>
                        <h4>
                            difficulty
                        </h4>
                    </span>
                    <span class="w-30 px-3 border border-2 border-black bg-d rounded-2">
                        <h1 class="fw-bold m-0">
                            +100xp
                        </h1>
                        <h4>
                            max reward
                        </h4>
                    </span>
                </div>
                <div class="col-6">
                    <div class="border border-2 border-black bg-d p-3 rounded-2 fs-4 fw-bold">
                        Terms And Conditions Applied
                    </div>
                </div>
                <div class="text-end mt-5">
                    <span class="px-4 btn py-2 fs-4 border border-2 border-black rounded-3">
                        Maybe Later
                    </span>
                    <span class="px-4 btn py-2 fs-4 border border-2 border-black rounded-3 fw-bolder bg-warning shadow ms-3">
                        Start Quiz
                    </span>
                </div>

            </div>
        </div>
    </div>









    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
